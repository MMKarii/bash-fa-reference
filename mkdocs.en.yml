site_name: Bash Professional Reference
site_description: Professional English Bash documentation for command-line work, scripting, automation, system administration, DevOps, and defensive security
site_author: MMKarii
site_url: https://mmkarii.github.io/bash-fa-reference/en/
repo_url: https://github.com/MMKarii/bash-fa-reference
repo_name: MMKarii/bash-fa-reference
edit_uri: edit/main/docs/en/
docs_dir: docs/en
site_dir: site/en
copyright: CC BY 4.0 · MMKarii
not_in_nav: |
  /reference/generated/**

theme:
  name: material
  custom_dir: overrides
  language: en
  direction: ltr
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search:
      lang:
        - en
        - fa
      separator: '[\s\-\u200c،؛,;:()/]+'

hooks:
  - hooks/language_links.py

extra:
  current_language: en
  site_root: https://mmkarii.github.io/bash-fa-reference
  social_image_url: https://raw.githubusercontent.com/MMKarii/bash-fa-reference/main/assets/social-preview-v1.jpg
  alternate:
    - name: فارسی
      link: https://mmkarii.github.io/bash-fa-reference/fa/
      lang: fa
    - name: English
      link: https://mmkarii.github.io/bash-fa-reference/en/
      lang: en

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details

nav:
  - Home: index.md
  - Reference Guide:
      - Overview: reference/index.md
  - Professional Guide:
      - Overview: book/index.md
      - Learning Path: learning-path.md
      - Cheat Sheet: cheatsheet.md
      - Bilingual Glossary: glossary.md
      - "1. Bash Fundamentals and Shell Model": 01-introduction.md
      - "2. Filesystem and Basic Commands": 02-filesystem-basics.md
      - "3. Variables, Expansion, and Quoting": 03-variables-expansion-quoting.md
      - "4. Redirection and Pipelines": 04-redirection-pipelines.md
      - "5. Text Processing": 05-text-processing.md
      - "6. Processes, Jobs, and Signals": 06-processes-jobs-signals.md
      - "7. Scripting Fundamentals": 07-scripting-fundamentals.md
      - "8. Robust Scripting": 08-robust-scripting.md
      - "9. Configuration, History, and Globbing": 09-configuration-history-globbing.md
      - "10. Networking and Remote Tools": 10-networking-remote-tools.md
      - "11. System Administration Automation": 11-sysadmin-automation.md
      - "12. DevOps and CI/CD": 12-devops-cicd.md
      - "13. Defensive Security": 13-defensive-security.md
      - "14. Debugging, Testing, and Portability": 14-debugging-testing-portability.md
  - References: references.md
  - Disclaimer: disclaimer.md
