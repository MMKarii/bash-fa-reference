site_name: مرجع حرفه‌ای Bash به زبان فارسی
site_description: مستند حرفه‌ای فارسی Bash برای خط فرمان، اسکریپت‌نویسی، خودکارسازی، مدیریت سیستم، DevOps و امنیت دفاعی
site_author: MMKarii
site_url: https://mmkarii.github.io/bash-fa-reference/fa/
repo_url: https://github.com/MMKarii/bash-fa-reference
repo_name: MMKarii/bash-fa-reference
edit_uri: edit/main/docs/fa/
docs_dir: docs/fa
site_dir: site/fa
copyright: CC BY 4.0 · MMKarii
not_in_nav: |
  /reference/generated/**

theme:
  name: material
  custom_dir: overrides
  language: fa
  direction: rtl
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    scheme: default
  font: false

plugins:
  - search:
      lang:
        - fa
        - en
      separator: '[\s\-\u200c،؛,;:()/]+'

hooks:
  - hooks/language_links.py

extra:
  current_language: fa
  site_root: https://mmkarii.github.io/bash-fa-reference
  social_image_url: https://raw.githubusercontent.com/MMKarii/bash-fa-reference/main/assets/social-preview-v1.jpg
  alternate:
    - name: فارسی
      link: https://mmkarii.github.io/bash-fa-reference/fa/
      lang: fa
    - name: English
      link: https://mmkarii.github.io/bash-fa-reference/en/
      lang: en

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details

nav:
  - خانه: index.md
  - Reference Guide:
      - معرفی: reference/index.md
  - Professional Guide:
      - معرفی: book/index.md
      - مسیر یادگیری: learning-path.md
      - برگه تقلب: cheatsheet.md
      - واژه‌نامه دوزبانه: glossary.md
      - "۱. مبانی Bash و مدل Shell": 01-introduction.md
      - "۲. فایل‌سیستم و دستورات پایه": 02-filesystem-basics.md
      - "۳. متغیرها، Expansion و Quoting": 03-variables-expansion-quoting.md
      - "۴. Redirection و Pipeline": 04-redirection-pipelines.md
      - "۵. پردازش متن": 05-text-processing.md
      - "۶. پردازه‌ها، Jobها و Signalها": 06-processes-jobs-signals.md
      - "۷. مبانی اسکریپت‌نویسی": 07-scripting-fundamentals.md
      - "۸. اسکریپت‌نویسی مقاوم": 08-robust-scripting.md
      - "۹. پیکربندی، History و Globbing": 09-configuration-history-globbing.md
      - "۱۰. شبکه و ابزارهای راه‌دور": 10-networking-remote-tools.md
      - "۱۱. مدیریت سیستم و خودکارسازی": 11-sysadmin-automation.md
      - "۱۲. DevOps و CI/CD": 12-devops-cicd.md
      - "۱۳. امنیت دفاعی": 13-defensive-security.md
      - "۱۴. Debugging، تست و Portability": 14-debugging-testing-portability.md
  - نصب: install/index.md
  - دانلود: download/index.md
  - انتشارها: releases/index.md
  - درباره: about/index.md
  - منابع: references.md
  - سلب مسئولیت: disclaimer.md
