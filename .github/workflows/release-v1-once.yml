name: release-v1-once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v1-once.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create v1.0.0 tag on clean parent commit
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 already exists"
            exit 0
          fi
          target="$(git rev-parse HEAD^)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a v1.0.0 "$target" -m "v1.0.0 - Bilingual Edition"
          git push origin v1.0.0

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.0.0 already exists"
            exit 0
          fi
          gh release create v1.0.0             --repo "$GITHUB_REPOSITORY"             --title "v1.0.0 - Bilingual Edition"             --notes-file .github/release-notes/v1.0.0.md
