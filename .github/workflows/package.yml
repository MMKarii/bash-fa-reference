name: package

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-artifacts:
    name: package / python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt && pip install -e .
      - run: |
          python tools/build_reference.py
          python tools/build_search_index.py
          python tools/build_completions.py
          python -m pytest tests/packaging -q
          python -m build
          python tools/verify_python_artifacts.py 2.0.0 dist/bashref-2.0.0-py3-none-any.whl dist/bashref-2.0.0.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: bashref-python-artifacts
          path: dist/

  linux-packages:
    name: package / linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: pip install -r requirements-dev.txt && pip install -e .
      - run: |
          python tools/build_completions.py
          python -m build
          python tools/build_deb.py dist/bashref-2.0.0-py3-none-any.whl --version 2.0.0
          python tools/build_release_assets.py --version 2.0.0
          python tools/write_checksums.py dist/* --output dist/SHA256SUMS
          test -s dist/bashref_2.0.0_all.deb
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: bashref-linux-artifacts
          path: dist/
