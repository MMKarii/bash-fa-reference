name: NEXORA Firestorage Probe 2.9.2
on:
  push:
    branches:
      - nexora-runtime-fetch-292
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Firestorage share client
        shell: bash
        run: |
          set -euo pipefail
          URL='https://firestorage.ai/_next/static/chunks/app/(files)/ja/f/page-4d19ae0a4ce39d79.js'
          curl -fsSL "$URL" -o page.js
          echo "JS_SIZE=$(stat -c%s page.js)"
          python3 - <<'PY'
          import re
          s=open('page.js',encoding='utf-8').read()
          needles=['fetch(','download','api/','shareId','publicId','presign','signed','attachment','objects']
          for n in needles:
              print('\nNEEDLE',n)
              start=0
              for i in range(12):
                  p=s.find(n,start)
                  if p<0: break
                  print(s[max(0,p-260):p+700])
                  start=p+len(n)
          PY
