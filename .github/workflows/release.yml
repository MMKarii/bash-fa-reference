name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bashref-v2.1-release
  cancel-in-progress: false

env:
  VERSION: "2.1.0"
  TAG: "v2.1.0"
  BASE_URL: "https://mmkarii.github.io/bash-fa-reference"

jobs:
  prepare:
    name: release / prepare
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.state.outputs.publish }}
      release_ref: ${{ steps.state.outputs.release_ref }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Detect release state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          if ! test -f release/v2.1.0.json; then
            echo "publish=no" >> "$GITHUB_OUTPUT"
            echo "No v2.1 release marker in this revision."
            exit 0
          fi

          python tools/release_version.py "$TAG" "$VERSION"

          if gh release view "$TAG" --json isDraft >/tmp/bashref-release-state.json 2>/dev/null; then
            IS_DRAFT="$(python -c 'import json; print(str(json.load(open("/tmp/bashref-release-state.json"))["isDraft"]).lower())')"
            if test "$IS_DRAFT" = "false"; then
              echo "publish=no" >> "$GITHUB_OUTPUT"
              echo "Release $TAG is already published."
              exit 0
            fi
          fi

          RELEASE_REF="$GITHUB_SHA"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            RELEASE_REF="$TAG"
            echo "Resuming release from existing immutable tag $TAG."
          fi

          echo "publish=yes" >> "$GITHUB_OUTPUT"
          echo "release_ref=$RELEASE_REF" >> "$GITHUB_OUTPUT"

  standalone:
    name: release / standalone / ${{ matrix.name }}
    needs: prepare
    if: ${{ needs.prepare.outputs.publish == 'yes' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            platform: linux
            arch: x86_64
            exe: bashref
          - name: macos-arm64
            os: macos-26
            platform: macos
            arch: arm64
            exe: bashref
          - name: macos-x86_64
            os: macos-26-intel
            platform: macos
            arch: x86_64
            exe: bashref
          - name: windows-x86_64
            os: windows-2025
            platform: windows
            arch: x86_64
            exe: bashref.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install standalone build dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Build and smoke-test standalone executable
        shell: bash
        run: |
          set -euo pipefail
          python tools/release_version.py "$TAG" "$VERSION"
          python tools/build_reference.py --version "$VERSION"
          python tools/build_search_index.py
          python -m PyInstaller --clean --noconfirm --onefile             --name bashref --collect-data bashref packaging/standalone_entry.py
          BINARY="dist/${{ matrix.exe }}"
          "$BINARY" --version | grep -Fq "bashref $VERSION"
          "$BINARY" --lang en --format json builtin printf | grep -Fq '"id": "builtin.printf"'
          "$BINARY" --format json doctor | grep -Fq '"runtime": "standalone"'
          python tools/package_standalone.py "$BINARY"             --version "$VERSION"             --platform "${{ matrix.platform }}"             --arch "${{ matrix.arch }}"             --out-dir standalone-dist

      - uses: actions/upload-artifact@v4
        with:
          name: bashref-standalone-${{ matrix.name }}
          path: standalone-dist/
          if-no-files-found: error

  publish:
    name: release / v2.1.0
    needs:
      - prepare
      - standalone
    if: ${{ needs.prepare.outputs.publish == 'yes' && needs.standalone.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mandoc rpm
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install -e .

      - name: Validate exact release source
        shell: bash
        run: |
          set -euo pipefail
          test -f release/v2.1.0.json
          python tools/release_version.py "$TAG" "$VERSION"
          python tools/validate_reference.py
          python tools/build_reference.py --version "$VERSION"
          python tools/build_search_index.py
          python tools/build_docs_reference.py
          python tools/build_manpages.py
          python tools/build_completions.py
          git diff --exit-code -- src/bashref/data packaging/completions
          python -m pytest -q
          mandoc -Tlint -Wwarning man/bashref.1 man/bashref-reference.5 man/generated/*.5

      - name: Build Python and Linux artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          python -m build
          python tools/verify_python_artifacts.py "$VERSION"             "dist/bashref-$VERSION-py3-none-any.whl"             "dist/bashref-$VERSION.tar.gz"

          python tools/build_deb.py "dist/bashref-$VERSION-py3-none-any.whl" --version "$VERSION"
          python tools/build_rpm.py --version "$VERSION"
          python tools/build_release_assets.py --version "$VERSION"

          sudo dpkg -i "dist/bashref_${VERSION}_all.deb"
          test "$(bashref --version)" = "bashref $VERSION"
          bashref --lang en --format json builtin printf | grep -Fq '"id": "builtin.printf"'
          bashref --format json doctor | grep -Fq '"status": "ok"'
          sudo dpkg -r bashref

          RPM="$(ls dist/bashref-${VERSION}-1*.noarch.rpm | head -n1)"
          sudo rpm -i --nodeps "$RPM"
          test "$(bashref --version)" = "bashref $VERSION"
          bashref --lang fa --format json builtin printf | grep -Fq '"id": "builtin.printf"'
          sudo rpm -e bashref

      - name: Build documentation release archive
        shell: bash
        run: |
          set -euo pipefail
          mkdocs build --strict -f mkdocs.en.yml -d site/en
          mkdocs build --strict -f mkdocs.fa.yml -d site/fa
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner             -czf "dist/bashref-$VERSION-docs.tar.gz" -C site en fa

      - name: Download standalone release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bashref-standalone-*
          path: dist
          merge-multiple: true

      - name: Verify standalone artifact set
        shell: bash
        run: |
          set -euo pipefail
          test -s "dist/bashref-$VERSION-linux-x86_64.tar.gz"
          test -s "dist/bashref-$VERSION-macos-arm64.tar.gz"
          test -s "dist/bashref-$VERSION-macos-x86_64.tar.gz"
          test -s "dist/bashref-$VERSION-windows-x86_64.zip"

      - name: Render Homebrew formula
        shell: bash
        run: |
          set -euo pipefail
          SDIST_SHA="$(sha256sum "dist/bashref-$VERSION.tar.gz" | awk '{print $1}')"
          python tools/render_homebrew_formula.py             --version "$VERSION"             --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/bashref-$VERSION.tar.gz"             --sha256 "$SDIST_SHA" > dist/bashref.rb
          ruby -c dist/bashref.rb

      - name: Write and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          python tools/write_checksums.py dist/* --output dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Create immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Bashref $VERSION"
            git push origin "$TAG"
          else
            test "$(git rev-list -n1 "$TAG")" = "$(git rev-parse HEAD)"
          fi

      - name: Create or refresh draft release
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          ASSETS=(dist/*)
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          if python tools/select_release.py "$RUNNER_TEMP/releases.json" "$TAG" release.json >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}"               --draft               --title "Bashref $VERSION"               --notes-file ".github/release-notes/$TAG.md"
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python tools/select_release.py "$RUNNER_TEMP/releases.json" "$TAG" release.json

      - name: Wait for v2.1 Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          READY=0
          for attempt in $(seq 1 48); do
            if curl -fsS "$BASE_URL/" | grep -Fq "Bashref $VERSION"               && curl -fsS "$BASE_URL/en/" | grep -Fq "Bashref $VERSION"               && curl -fsS "$BASE_URL/fa/" | grep -Fq "Bashref $VERSION"               && curl -fsS "$BASE_URL/v2.1/en/" | grep -Fq "Bashref $VERSION"               && curl -fsS "$BASE_URL/v2.1/fa/" | grep -Fq "Bashref $VERSION"; then
              READY=1
              break
            fi
            sleep 10
          done
          test "$READY" = "1"

      - name: Verify draft release and public documentation
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python tools/select_release.py "$RUNNER_TEMP/releases.json" "$TAG" release.json
          python tools/verify_public_release.py             --release-json release.json             --checksums dist/SHA256SUMS             --base-url "$BASE_URL"

      - name: Publish verified release
        run: |
          gh release edit "$TAG" --draft=false --latest
          gh release view "$TAG" --json tagName,isDraft,url

      - name: Upload release-build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bashref-v2.1-release-evidence
          path: |
            dist/
            release.json
          if-no-files-found: ignore
