name: probe-firestorage

on:
  push:
    branches: [bash-docs-v1]
    paths:
      - '.github/workflows/probe-firestorage.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve temporary transfer API
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.firestorage.ai/prod'
          share='kuXLV6cvllP3'
          curl -sS -c /tmp/cookies -D /tmp/headers -X POST             -H 'Content-Type: application/json'             "$api/shares/$share/cushion-sessions"             -d '{}' -o /tmp/body
          sed -n '1,40p' /tmp/headers
          cat /tmp/body
          echo
