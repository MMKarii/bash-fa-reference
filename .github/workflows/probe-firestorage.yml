name: probe-firestorage

on:
  push:
    branches: [bash-docs-v1]
    paths: ['.github/workflows/probe-firestorage.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect firestorage client chunks
        shell: bash
        run: |
          set -euo pipefail
          base='https://firestorage.ai/_next/static/chunks'
          for p in             '8500-f4d7bfbe7500f274.js'             '8437-d65cc193dc908afa.js'             '5841-1160578ba9bb4f3e.js'             '4899-d89df949f2dbd5af.js'             'app/(files)/ja/f/page-4d19ae0a4ce39d79.js'
          do
            echo "=== $p ==="
            curl -L -sS "$base/$p" -o /tmp/chunk.js
            wc -c /tmp/chunk.js
            tr ';' '\n' < /tmp/chunk.js | grep -Ei 'fetch\(|axios|/api/|download|share|public|presign|signed|object|file' | head -160 || true
          done
