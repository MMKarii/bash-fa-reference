name: probe-firestorage

on:
  push:
    branches: [bash-docs-v1]
    paths:
      - '.github/workflows/probe-firestorage.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Extract API constants
        shell: bash
        run: |
          set -euo pipefail
          base='https://firestorage.ai/_next/static/chunks'
          curl -L -sS "$base/4899-d89df949f2dbd5af.js" -o /tmp/a.js
          curl -L -sS "$base/5841-1160578ba9bb4f3e.js" -o /tmp/b.js
          echo '=== api host/base ==='
          grep -Eo '.{0,500}(api\.firestorage|/api/|apiBase|NEXT_PUBLIC).{0,700}' /tmp/a.js /tmp/b.js | head -80 || true
          echo '=== share endpoint ==='
          grep -Eo '.{0,800}shareEndpoint.{0,800}' /tmp/a.js /tmp/b.js | head -40 || true
          echo '=== initial share state ==='
          grep -Eo '.{0,800}(cushion-sessions|files\?maxResults).{0,800}' /tmp/a.js /tmp/b.js | head -60 || true
