name: probe-firestorage

on:
  push:
    branches: [bash-docs-v1]
    paths: ['.github/workflows/probe-firestorage.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect firestorage download client
        shell: bash
        run: |
          set -euo pipefail
          page='https://firestorage.ai/ja/f/kuXLV6cvllP3'
          curl -L -sS "$page" -o /tmp/page.html
          js_path="$(grep -o '/_next/static/chunks/app/(files)/ja/f/page-[^"]*\.js' /tmp/page.html | head -1)"
          echo "JS_PATH=$js_path"
          test -n "$js_path"
          curl -L -sS "https://firestorage.ai$js_path" -o /tmp/app.js
          echo '=== endpoint-like strings ==='
          strings /tmp/app.js | grep -Eo '(/api/[^"'"'"' ]+|https?://[^"'"'"' ]+|download[^"'"'"' ]*|share[^"'"'"' ]*)' | head -200 || true
          echo '=== context around fetch/axios ==='
          tr ';' '\n' < /tmp/app.js | grep -Ei 'fetch\(|axios|download|share|public|file' | head -240 || true
