name: probe-firestorage

on:
  push:
    branches: [bash-docs-v1]
    paths:
      - '.github/workflows/probe-firestorage.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Extract API helper
        shell: bash
        run: |
          set -euo pipefail
          url='https://firestorage.ai/_next/static/chunks/5841-1160578ba9bb4f3e.js'
          curl -L -sS "$url" -o /tmp/chunk.js
          python3 -c 's=open("/tmp/chunk.js",encoding="utf-8").read(); i=s.find("firestorage.ai"); print(s[max(0,i-1200):i+4500])'
