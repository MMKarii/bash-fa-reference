name: NEXORA Windows Share Probe 2.9.2
on:
  push:
    branches:
      - nexora-runtime-fetch-292
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    steps:
      - name: Inspect share page in Edge
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check selenium
          @'
          from selenium import webdriver
          from selenium.webdriver.edge.options import Options
          from selenium.webdriver.common.by import By
          import time
          o=Options(); o.add_argument("--headless=new"); o.add_argument("--disable-gpu"); o.add_argument("--no-sandbox")
          d=webdriver.Edge(options=o)
          try:
              d.get("https://firestorage.ai/ja/f/fQusM--ibaOA")
              time.sleep(4)
              print("TITLE",d.title)
              print("URL",d.current_url)
              print("BUTTONS")
              for e in d.find_elements(By.TAG_NAME,"button"):
                  print(repr(e.text),e.get_attribute("outerHTML")[:500])
              print("LINKS")
              for e in d.find_elements(By.TAG_NAME,"a"):
                  t=e.text.strip(); h=e.get_attribute("href")
                  if t or h and ("download" in h.lower() or "file" in h.lower()):
                      print(repr(t),h)
              print("BODY",d.find_element(By.TAG_NAME,"body").text[:12000])
          finally:
              d.quit()
          '@ | Set-Content share_probe.py -Encoding UTF8
          python share_probe.py
