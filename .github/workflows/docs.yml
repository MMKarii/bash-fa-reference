name: docs

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: docs / build-and-deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Cache MkDocs
        uses: actions/cache@v6
        with:
          key: mkdocs-material-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          path: ~/.cache
          restore-keys: |
            mkdocs-material-${{ runner.os }}-

      - name: Install documentation and development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mandoc
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Generate validate and test Bashref product
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import bashref; print(bashref.__version__)')"
          python tools/validate_reference.py
          python tools/build_reference.py --version "$VERSION"
          python tools/build_search_index.py
          python tools/build_completions.py
          git diff --exit-code -- src/bashref/data packaging/completions
          python tools/build_docs_reference.py
          python tools/build_manpages.py
          python -m pytest -q
          mandoc -Tlint -Wwarning man/bashref.1 man/bashref-reference.5 man/generated/*.5

      - name: Build Bashref distributions
        run: python -m build

      - name: Smoke-test built wheel
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import bashref; print(bashref.__version__)')"
          SMOKE="$RUNNER_TEMP/bashref-smoke"
          python -m venv "$SMOKE"
          WHEEL="$(ls dist/bashref-*.whl)"
          "$SMOKE/bin/pip" install --no-deps "$WHEEL"
          test "$("$SMOKE/bin/bashref" --version)" = "bashref $VERSION"
          "$SMOKE/bin/bashref" --lang en search printf | grep -Fq 'printf'
          "$SMOKE/bin/bashref" --lang en --format json builtin printf | grep -Fq '"id": "builtin.printf"'
          "$SMOKE/bin/bashref" --format json doctor | grep -Fq '"status": "ok"'

      - name: Test documentation tooling
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Check bilingual structure links anchors translation freshness and public safety
        run: python scripts/check_docs.py

      - name: Check external links
        run: python scripts/check_external_links.py

      - name: Build Persian documentation
        run: mkdocs build --strict -f mkdocs.fa.yml -d site/fa

      - name: Build English documentation
        run: mkdocs build --strict -f mkdocs.en.yml -d site/en

      - name: Create latest aliases
        run: |
          mkdir -p site/latest
          cp -a site/fa site/latest/fa
          cp -a site/en site/latest/en

      - name: Build stable v1.0 snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/v1.0
          if git rev-parse --verify --quiet refs/tags/v1.0.0 >/dev/null; then
            V1_DIR="$RUNNER_TEMP/bash-reference-v1"
            git worktree add --detach "$V1_DIR" v1.0.0
            trap 'git worktree remove --force "$V1_DIR" >/dev/null 2>&1 || true' EXIT
            test "$(git -C "$V1_DIR" describe --tags --exact-match)" = "v1.0.0"
            mkdocs build --strict -f "$V1_DIR/mkdocs.fa.yml" -d "$GITHUB_WORKSPACE/site/v1.0/fa"
            mkdocs build --strict -f "$V1_DIR/mkdocs.en.yml" -d "$GITHUB_WORKSPACE/site/v1.0/en"
            git worktree remove --force "$V1_DIR"
            trap - EXIT
          fi

      - name: Build stable v2.0 snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/v2.0
          if git rev-parse --verify --quiet refs/tags/v2.0.0 >/dev/null; then
            V2_DIR="$RUNNER_TEMP/bash-reference-v2"
            git worktree add --detach "$V2_DIR" v2.0.0
            trap 'git worktree remove --force "$V2_DIR" >/dev/null 2>&1 || true' EXIT
            test "$(git -C "$V2_DIR" describe --tags --exact-match)" = "v2.0.0"
            mkdocs build --strict -f "$V2_DIR/mkdocs.fa.yml" -d "$GITHUB_WORKSPACE/site/v2.0/fa"
            mkdocs build --strict -f "$V2_DIR/mkdocs.en.yml" -d "$GITHUB_WORKSPACE/site/v2.0/en"
            git worktree remove --force "$V2_DIR"
            trap - EXIT
          fi

      - name: Build stable v2.1 snapshot
        shell: bash
        run: |
          set -euo pipefail
          if test -f release/v2.1.0.json; then
            mkdir -p site/v2.1
            rm -rf site/v2.1/fa site/v2.1/en
            if git rev-parse --verify --quiet refs/tags/v2.1.0 >/dev/null; then
              V21_DIR="$RUNNER_TEMP/bash-reference-v21"
              git worktree add --detach "$V21_DIR" v2.1.0
              trap 'git worktree remove --force "$V21_DIR" >/dev/null 2>&1 || true' EXIT
              mkdocs build --strict -f "$V21_DIR/mkdocs.fa.yml" -d "$GITHUB_WORKSPACE/site/v2.1/fa"
              mkdocs build --strict -f "$V21_DIR/mkdocs.en.yml" -d "$GITHUB_WORKSPACE/site/v2.1/en"
              git worktree remove --force "$V21_DIR"
              trap - EXIT
            else
              cp -a site/fa site/v2.1/fa
              cp -a site/en site/v2.1/en
            fi
          fi

      - name: Publish social preview
        run: |
          mkdir -p site/assets
          cp assets/social-preview-v1.jpg site/assets/social-preview-v1.jpg
          test -s site/assets/social-preview-v1.jpg

      - name: Add root publishing metadata
        run: |
          cp site-root/index.html site/index.html
          cp site-root/robots.txt site/robots.txt
          cp site-root/sitemap.xml site/sitemap.xml

      - name: Check built-site accessibility and metadata
        run: python scripts/check_built_site.py

      - name: Verify complete published output
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import bashref; print(bashref.__version__)')"
          test -f site/index.html
          test -f site/robots.txt
          test -f site/sitemap.xml
          test -f site/fa/index.html
          test -f site/en/index.html
          test -f site/fa/sitemap.xml
          test -f site/en/sitemap.xml
          test -f site/latest/fa/index.html
          test -f site/latest/en/index.html
          test -f site/v1.0/fa/index.html
          test -f site/v1.0/en/index.html
          test -f site/v2.0/fa/index.html
          test -f site/v2.0/en/index.html
          test -f site/v2.0/fa/reference/index.html
          test -f site/v2.0/en/reference/index.html
          if test -f release/v2.1.0.json; then
            test -f site/v2.1/fa/index.html
            test -f site/v2.1/en/index.html
            test -f site/v2.1/fa/reference/index.html
            test -f site/v2.1/en/reference/index.html
          fi
          test -f site/fa/14-debugging-testing-portability/index.html
          test -f site/en/14-debugging-testing-portability/index.html
          test -f site/fa/glossary/index.html
          test -f site/en/glossary/index.html
          test -f site/fa/reference/index.html
          test -f site/en/reference/index.html
          test -f site/fa/reference/generated/builtins/printf/index.html
          test -f site/en/reference/generated/builtins/printf/index.html
          test -f site/fa/reference/generated/variables/BASH_SOURCE/index.html
          test -f site/en/reference/generated/variables/BASH_SOURCE/index.html
          test -f site/fa/assets/brand-banner.webp
          test -f site/en/assets/brand-banner.webp
          test -f site/assets/social-preview-v1.jpg
          grep -Fq 'https://mmkarii.github.io/bash-fa-reference/fa/' site/fa/index.html
          grep -Fq 'https://mmkarii.github.io/bash-fa-reference/en/' site/en/index.html
          grep -Fq "Bashref $VERSION" site/en/index.html
          grep -Fq "Bashref $VERSION" site/fa/index.html
          grep -Fq 'Bashref 2.0.0' site/v2.0/en/index.html
          grep -Fq 'Bashref 2.0.0' site/v2.0/fa/index.html
          if test -f release/v2.1.0.json; then
            grep -Fq "Bashref $VERSION" site/v2.1/en/index.html
            grep -Fq "Bashref $VERSION" site/v2.1/fa/index.html
          fi
          grep -Fq 'Bashref' site/index.html
          file site/assets/social-preview-v1.jpg | grep -Eq '1280 ?x ?640'

      - name: Deploy to gh-pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
