[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bashref"
version = "2.0.0"
description = "Offline bilingual Bash reference CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSES/MIT.txt", "LICENSES/CC-BY-4.0.txt"]
authors = [{ name = "MMKarii" }]
dependencies = []

[project.scripts]
bashref = "bashref.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bashref" = ["data/*.json", "data/**/*.json"]
